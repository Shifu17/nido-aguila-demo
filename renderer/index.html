<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <title>Club Nido Águila</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="side">
    <div class="brand">
      <div class="logo" aria-hidden="true">NA</div>
      <div>
        <div class="brand-name" id="club-nombre">Club Nido Águila</div>
        <div class="brand-sub">Control del club</div>
      </div>
    </div>
    <nav class="nav" aria-label="Secciones">
      <button data-view="jugadores" class="active">Jugadores</button>
      <button data-view="cobros">Cobro de mensualidades</button>
      <button data-view="recibos">Recibos</button>
      <button data-view="ajustes">Ajustes</button>
    </nav>
    <div class="side-stats" id="side-stats" aria-live="polite"></div>
    <div class="side-foot" id="side-foot">Demo</div>
  </aside>

  <main id="view" class="view" tabindex="-1"></main>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" id="modal-card"></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="print-area" class="print-area"></div>

  <script src="app.js"></script>
</body>
</html>
